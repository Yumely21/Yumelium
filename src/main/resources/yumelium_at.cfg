# Access Transformer for Yumelium.
# Write entries in MCP names (stable_39-1.12); Unimined remaps them to SRG in the built artifact.
# Embeddium's ATs are Mojang-mapped (see reference/embeddium-16.5/src/main/resources/META-INF/accesstransformer.cfg)
# and must be translated to 1.12.2 MCP names here as the port progresses.
# NOTE: the modern Forge AT parser rejects blank comment lines, so never leave a bare '#'.
# Example entry (kept as a comment): public net.minecraft.client.Minecraft fileResourcepacks

