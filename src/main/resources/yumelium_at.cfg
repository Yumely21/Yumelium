# --- Dev-environment compat for THIRD-PARTY mods' ATs (2026-07-27) ---
# Mods in run/client/mods ship SRG-named ATs that cannot match the MCP-named dev runtime, so their opened
# fields stay private in runClient and they crash with IllegalAccessError (Alfheim was the first hit:
# BlockPos.X_SHIFT). Mirroring their entries here in MCP names fixes dev runs; in production both their own
# AT and this one (remapped to SRG) apply — redundant and harmless.
