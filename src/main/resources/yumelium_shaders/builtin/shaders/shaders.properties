# Yumelium built-in test shader pack.
# Purpose: validate the shader-pack loader (M1) end-to-end without requiring the user to supply an external pack.
# This is NOT yet a visual shader — the programs are minimal pass-throughs used to exercise discovery/parsing.
# A couple of representative keys so the properties parser has something to read:
shadowMapResolution=1024
sunPathRotation=-40.0

# Configurable options exposed in the "Shader Pack Settings" screen. Each name has a matching #define in composite.fsh
# (gated with #ifdef); the settings screen toggles them (a commented-out #define = off).
screen = SHADOWS DIRECTIONAL_LIGHT SSAO BLOOM
